        // 1. Ensure fetch is configurable and writable
        try {

            Object.defineProperty(target, 'fetch', {
              get: function() {
                return originalFetch;
              },

        // Helper to check if an error is an abort/cancellation
        function isAbortError(err, msg) {
          var text = String(msg || (err && (err.message || err)) || '').toLowerCase();
          var name = (err && err.name) || '';
          var code = (err && err.code) || '';
          return (
            name === 'AbortError' ||
            code === 'auth/popup-closed-by-user' ||
            code === 'auth/cancelled-popup-request' ||
            text.indexOf('aborted a request') !== -1 ||
            text.indexOf('user aborted') !== -1 ||
            text.indexOf('cannot set property fetch') !== -1
          );
        }

        // 2. Intercept console.error to filter out benign abort messages
        try {
          var origConsoleError = console.error;
          console.error = function() {

              var arg = arguments[i];
              if (isAbortError(arg, (arg && arg.message) || arg)) {

              }

            return origConsoleError.apply(console, arguments);
          };
        } catch (e) {}

        // 3. Early capture-phase event listeners to suppress abort errors
        try {
          target.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            if (isAbortError(reason)) {
              if (typeof event.preventDefault === 'function') event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
              return true;
            }
          }, true);

          target.addEventListener('error', function(event) {
            var err = event && event.error;
            var msg = (event && event.message) || '';
            if (isAbortError(err, msg)) {
              if (typeof event.preventDefault === 'function') event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
              return true;
            }

        } catch (e) {}

        // 4. Wrap addEventListener so future listeners also ignore abort errors
        try {
          var origAddEventListener = target.addEventListener;
          target.addEventListener = function(type, listener, options) {
            if ((type === 'unhandledrejection' || type === 'error') && typeof listener === 'function') {

                var reason = type === 'unhandledrejection' ? (event && event.reason) : (event && event.error);
                var msg = (event && event.message) || '';
                if (isAbortError(reason, msg)) {
                  if (typeof event.preventDefault === 'function') event.preventDefault();
                  if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
                  return true;
                }
                return listener.apply(this, arguments);
              };
              return origAddEventListener.call(this, type, wrapped, options);
            }
            return origAddEventListener.apply(this, arguments);
          };
        } catch (e) {}

              };
            },
            configurable: true,
            enumerable: true
          });

          Object.defineProperty(target, 'onunhandledrejection', {
            get: function() { return _onunhandledrejection; },

              };
            },

        } catch (e) {}
